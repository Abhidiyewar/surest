spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/surest
    username: postgres
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: HikariCP

  flyway:
    enabled: true
    locations: classpath:db
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC

server:
  port: 9090

jwt:
  secret: y7tX0Xc7jQhD7jX1eY3pA4KfQ5zJ8XwRrM2xH+9vY3M=
  expiration-ms: 3600000

logging:
  level:
    root: INFO
    org.springframework.cache: DEBUG
